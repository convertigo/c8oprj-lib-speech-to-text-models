import groovy.json.JsonSlurper
import java.security.MessageDigest

buildscript {
	repositories {
		mavenLocal()
		maven {
			url "https://m2.convertigo.com"
		}
		mavenCentral()
	}
	dependencies {
		classpath 'com.convertigo:gradle-plugin:8.4.6'
	}
}

// The model files are not in git: in each model project, 'fetchModels' downloads the files listed in its
// models.json, at their pinned revision, into DisplayObjects/models, and checks their SHA-256. 'car' runs it first.
//   ./gradlew car                                        every CAR, in <project>/build
//   ./gradlew :lib_SpeechToText_model_whisperBase:car    one model
static String sha256(File f) {
	MessageDigest md = MessageDigest.getInstance('SHA-256')
	f.withInputStream { input ->
		byte[] buffer = new byte[1 << 16]
		int n
		while ((n = input.read(buffer)) > 0) {
			md.update(buffer, 0, n)
		}
	}
	return md.digest().encodeHex().toString()
}

subprojects {
	apply plugin: 'convertigo'

	tasks.register('fetchModels') {
		group = 'build'
		description = 'Downloads the model files of models.json at their pinned revision and checks their SHA-256.'
		def spec = file('models.json')
		def modelsDir = file('DisplayObjects/models')
		// always runs: it checks the SHA-256 of every file itself and downloads only what is missing or different
		outputs.upToDateWhen { false }
		doLast {
			def json = new JsonSlurper().parse(spec)
			(json.models ?: []).each { m ->
				m.files.each { f ->
					def target = new File(modelsDir, "${m.repo}/${f.path}")
					if (target.exists() && sha256(target) == f.sha256) {
						return
					}
					target.parentFile.mkdirs()
					def url = "https://huggingface.co/${m.repo}/resolve/${m.revision}/${f.path}"
					println "Downloading ${url}"
					def tmp = new File(target.path + '.part')
					new URI(url).toURL().withInputStream { input -> tmp.withOutputStream { out -> out << input } }
					def hash = sha256(tmp)
					if (hash != f.sha256) {
						tmp.delete()
						throw new GradleException("SHA-256 mismatch for ${m.repo}/${f.path}: ${hash}")
					}
					target.delete()
					tmp.renameTo(target)
				}
			}
			// archives (Vosk): a zip downloaded and checked, repacked as the .tar.gz that vosk-browser loads
			(json.archives ?: []).each { a ->
				def zip = layout.buildDirectory.file("downloads/${a.name}.zip").get().asFile
				def marker = layout.buildDirectory.file("downloads/${a.name}.packed").get().asFile
				def target = new File(modelsDir, a.target)
				if (target.exists() && marker.exists() && marker.text == a.sha256) {
					return
				}
				if (!(zip.exists() && sha256(zip) == a.sha256)) {
					zip.parentFile.mkdirs()
					println "Downloading ${a.url}"
					def tmp = new File(zip.path + '.part')
					new URI(a.url).toURL().withInputStream { input -> tmp.withOutputStream { out -> out << input } }
					def hash = sha256(tmp)
					if (hash != a.sha256) {
						tmp.delete()
						throw new GradleException("SHA-256 mismatch for ${a.url}: ${hash}")
					}
					zip.delete()
					tmp.renameTo(zip)
				}
				def unpacked = layout.buildDirectory.dir("downloads/${a.name}").get().asFile
				project.delete(unpacked)
				ant.unzip(src: zip, dest: unpacked)
				target.parentFile.mkdirs()
				target.delete()
				ant.tar(destfile: target, compression: 'gzip', basedir: unpacked)
				project.delete(unpacked)
				marker.text = a.sha256
			}
		}
	}

	car {
		dependsOn 'fetchModels'
		doLast {
			println "Saved Convertigo archive: $destinationFile"
		}
	}
}
